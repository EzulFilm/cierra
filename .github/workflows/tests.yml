name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Command line
        run: |
          for f in looks/*.cierra examples/*.cierra; do cierra check "$f" > /dev/null; done
          cierra dctl --split looks/teal_night.cierra "$RUNNER_TEMP/build"
          cierra wgsl --split looks/teal_night.cierra "$RUNNER_TEMP/build"
      - name: gcc (DCTL CPU harness)
        run: gcc --version | head -1
      - name: Tests
        run: python -m pytest -q --basetemp="$RUNNER_TEMP/pytest"
      - name: Generated docs are current
        run: |
          python tools/make_authoring.py
          git diff --exit-code docs/authoring.md docs/ops_manifest.json
      - name: Dependency licences (no GPL / AGPL / non-commercial in the library)
        run: python tools/sbom.py --check > /dev/null
